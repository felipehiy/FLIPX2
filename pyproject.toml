[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipx2"
version = "0.1.0"
description = "Consent-first OSINT orchestrator for Kali Linux"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flipx2 = "flipx2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
